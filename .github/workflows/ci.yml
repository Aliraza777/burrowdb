name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: crash soak (200 rounds per engine)
        run: BURROWDB_CRASH_ITERS=200 go test -run TestCrashRecovery -count=1 ./internal/kv ./internal/pager
      - name: fuzz the B+tree (60s)
        run: go test -run '^$' -fuzz FuzzTree -fuzztime 60s ./internal/btree
      - name: fuzz the document decoder (30s)
        run: go test -run '^$' -fuzz FuzzDecode -fuzztime 30s ./internal/doc
      - name: fuzz the index key encoding (30s)
        run: go test -run '^$' -fuzz FuzzKeyOrder -fuzztime 30s ./internal/value
      - run: go build ./cmd/burrowdb

  ts-client:
    name: TypeScript client (against a real server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
