name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: crash soak (200 rounds per engine)
        run: BURROWDB_CRASH_ITERS=200 go test -run TestCrashRecovery -count=1 ./internal/kv ./internal/pager
      - name: fuzz the B+tree (60s)
        run: go test -run '^$' -fuzz FuzzTree -fuzztime 60s ./internal/btree
      - name: fuzz the document decoder (30s)
        run: go test -run '^$' -fuzz FuzzDecode -fuzztime 30s ./internal/doc
      - run: go build ./cmd/burrowdb
